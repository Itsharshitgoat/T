<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T Settings</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      body {
        background-color: var(--primary-bg);
        overflow: auto;
        display: block;
        padding: 20px;
      }
      h1 { font-size: 24px; margin-bottom: 20px; }
      .section { margin-bottom: 24px; background: var(--secondary-bg); padding: 16px; border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); }
      .section h2 { font-size: 18px; margin-bottom: 12px; }
      .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
      label { font-size: 14px; }
      input[type="text"], input[type="number"] { padding: 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--primary-bg); color: var(--primary-text); }
      button { padding: 6px 12px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Settings</h1>
    <div class="section" id="general">
      <h2>General</h2>
      <div class="row">
        <label>Launch at Login</label>
        <input type="checkbox" id="launch-login" />
      </div>
      <div class="row">
        <label>Auto Hide Duration (s)</label>
        <input type="number" id="auto-hide" value="15" />
      </div>
    </div>
    <div class="section" id="ai">
      <h2>AI</h2>
      <div class="row">
        <label>Ollama URL</label>
        <input type="text" id="ollama-url" value="http://localhost:11434" />
      </div>
      <div class="row">
        <label>Model Selection</label>
        <input type="text" id="model-selection" value="gemma4:4b" />
      </div>
    </div>
    <button id="save-btn">Save Settings</button>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
